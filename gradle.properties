# ============================================================
#  AdminTools — identidad del proyecto y ajustes de Gradle
#  (los valores de aquí los lee también el plugin.yml generado)
# ============================================================

# --- Identidad del plugin ---
# Nota: los valores usan escapes \uXXXX para que funcionen con cualquier
# codificación de properties (Java los lee como ISO-8859-1).
group=com.admintools
version=0.4.5
description=Suite de administraci\u00f3n para servidores Paper 26.1+
author=David Garcia
# Descomenta para que aparezca como 'website' en plugin.yml:
#url=https://ejemplo.com

# --- Servidor de pruebas (./gradlew runServer) ---
paperServerVersion=26.1.2

# --- Gradle ---
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
