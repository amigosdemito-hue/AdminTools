name: build

# Compila y pasa las pruebas en cada push y pull request. El jar queda como
# artefacto del run, así se puede probar sin montar Gradle en local.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar y probar
        run: ./gradlew build --no-daemon

      - name: Guardar el jar
        uses: actions/upload-artifact@v4
        with:
          name: AdminTools
          path: |
            build/libs/AdminTools-*.jar
            !build/libs/*-plain.jar
          if-no-files-found: error
