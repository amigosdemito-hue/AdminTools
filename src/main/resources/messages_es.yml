  player-not-found: "<red>No encontré al jugador <white>%player%</white>."
  player-never-seen: "<red>El jugador <white>%player%</white> nunca entró a este servidor."
  invalid-duration: "<red>Duración inválida: <white>%input%</white>. Ejemplos: <white>30m</white>, <white>12h</white>, <white>7d</white>, <white>permanent</white>."
  invalid-number: "<red>Número inválido: <white>%input%</white>."
  usage: "<yellow>Uso correcto: <white>%usage%"
  unknown-argument: "<red>Opción desconocida: <white>%input%</white>."
  internal-error: "<red>Error interno al ejecutar <white>%command%</white>. Revisa la consola del servidor."
