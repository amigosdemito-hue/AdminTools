# ============================================================
#  AdminTools — mensajes en español
#  Formato: MiniMessage (https://docs.advntr.dev/minimessage/format.html)
#  Placeholders: %variable% (los reemplaza el plugin)
# ============================================================

# Versión del formato de mensajes. Al subirlo en una actualización, este archivo
# se regenera con el diseño nuevo y tus textos se guardan en un .bak al lado.
messages-version: 2

prefix: "<dark_gray>[<gradient:#48c9ff:#2b6cff><bold>AdminTools</bold></gradient><dark_gray>] <reset>"

generic:
