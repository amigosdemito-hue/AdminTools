# ============================================================
#  AdminTools — configuración principal
#  Tras editar: /at reload  (o reinicia el servidor si cambias el storage)
# ============================================================

# Archivo de mensajes a usar: messages_es.yml o messages_en.yml
language: es

# Mostrar trazas completas en consola cuando algo falla (útil al depurar)
debug: false

# ------------------------------------------------------------
#  Presencia en consola
#  El letrero de arranque resume versión, servidor, almacenamiento, módulos,
#  integraciones y estado en un solo bloque, para verlo de un vistazo entre
#  las líneas del servidor.
# ------------------------------------------------------------
console:
  # Dibujar el letrero al arrancar. false = arranque discreto (una línea).
  banner: true
  # Color del letrero:
  #   auto   = usa colores ANSI si la consola los soporta (normal en Paper,
  #            Pterodactyl y consolas modernas) y texto plano si no.
  #   always = fuerza colores ANSI.
  #   never  = texto plano: el dibujo se ve igual pero el archivo latest.log
  #            queda sin códigos de escape (recomendado si lees el log con grep).
  color: auto

# Nombre de esta instancia. Con MySQL compartido entre varios servidores,
# sirve para saber en cuál ocurrió cada sanción o reporte. Vacío = nombre del servidor.
server-name: ""

# ------------------------------------------------------------
#  Almacenamiento
#  sqlite = un archivo en plugins/AdminTools/ (ideal 1 servidor)
#  mysql  = base compartida (necesario para red de servidores)
# ------------------------------------------------------------
storage:
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: admintools
    user: admintools
    password: ""
    # Parámetros extra de la conexión (se añaden tal cual a la URL JDBC)
    parameters: "useSSL=false&characterEncoding=utf8&serverTimezone=UTC"
    table-prefix: "sa_"
  # Cuántas conexiones se abren a la vez.
  # En sqlite se usa WAL: varias conexiones pueden leer mientras una escribe,
  # así que lo normal es dejar 4 (se admiten de 2 a 4). Con 1, una copia de
  # inventario en segundo plano bloqueaba la lectura de un comando.
  # En mysql súbelo si tienes mucho staff trabajando a la vez.
  pool-size: 4
  # Retención de datos: se purga automáticamente lo viejo
  retention:
    chat-days: 30
    ip-days: 60
    audit-days: 180
    # Cuántas copias de inventario se guardan por jugador
    snapshots-per-player: 5
    purge-interval-hours: 6

# ------------------------------------------------------------
#  Sanciones
# ------------------------------------------------------------
sanctions:
  # Anunciar cada sanción a todo el servidor
  broadcast: true
  # Avisar al staff cuando entra un jugador sancionado
  notify-staff-on-join: true
  # Sancionar sin anunciarlo (solo lo ve el staff)
  silent-by-default: false
  # Mostrar la IP en el anuncio de IP-ban
  show-ip-in-broadcast: false

  # Días tras los que una advertencia deja de contar para el escalado
  # (y para los contadores de /history). 0 = no caducan nunca.
  # LiteBans usa 7; ponlo a 7 si quieres ese comportamiento.
  warn-decay-days: 0

  # Un miembro del staff no puede sancionar a alguien de su mismo rango
  # o superior. La consola y quien tenga admintools.sanction.force se saltan
  # esta protección.
  protect-higher-ranks: true

  # Duración máxima que cada rango puede aplicar.
  # El plugin busca el límite más alto entre los permisos que tenga el staff.
  duration-limits:
    admintools.limit.new: 1d
    admintools.limit.mod: 30d
    admintools.limit.admin: permanent

  # Escalado automático al acumular advertencias
  auto-escalate:
    enabled: true
    window-days: 30
    threshold: 3
    action:
      type: MUTE
      duration: 1d
      reason: "Acumulación de advertencias"

  # Plantillas: /punish <plantilla> <jugador> [razón]
  # type: BAN | IP_BAN | MUTE | SHADOW_MUTE | WARN | KICK
  templates:
    hacking:
      type: IP_BAN
      duration: permanent
      reason: "Uso de clientes o módulos no permitidos (cheating)"
    xray:
      type: BAN
      duration: 30d
      reason: "Uso de rayos X / texturas de minerales"
    grief:
      type: BAN
      duration: 7d
      reason: "Griefing y destrucción de construcciones ajenas"
    insultos:
      type: MUTE
      duration: 1d
      reason: "Faltas de respeto a otros jugadores"
    spam:
      type: MUTE
      duration: 1h
      reason: "Spam en el chat"
    publicidad:
      type: MUTE
      duration: 1d
      reason: "Publicidad de otros servidores"
    evadir-staff:
      type: BAN
      duration: 14d
      reason: "Evadir al staff o desconectarse para evitar una sanción"

  # Escaleras de sanciones: /ladder <escalera> <jugador> [razón]
  # Van subiendo un paso por cada sanción previa dentro de la ventana.
  ladders:
    chat:
      window-days: 30
      steps:
        - { type: WARN, reason: "Lenguaje inapropiado en el chat" }
        - { type: MUTE, duration: 1h, reason: "Reincidencia: lenguaje inapropiado" }
        - { type: MUTE, duration: 1d, reason: "Reincidencia: lenguaje inapropiado" }
        - { type: MUTE, duration: 7d, reason: "Reincidencia: lenguaje inapropiado" }
        - { type: BAN, duration: 7d, reason: "Reincidencia grave en el chat" }
    publicidad:
      window-days: 90
      steps:
        - { type: WARN, reason: "Publicidad de otros servidores" }
        - { type: MUTE, duration: 1d, reason: "Reincidencia: publicidad" }
        - { type: BAN, duration: 7d, reason: "Reincidencia: publicidad" }
        - { type: IP_BAN, duration: permanent, reason: "Reincidencia grave: publicidad" }
    cheating:
      window-days: 365
      steps:
        - { type: BAN, duration: 7d, reason: "Uso de clientes no permitidos (primer aviso)" }
        - { type: IP_BAN, duration: permanent, reason: "Reincidencia: cheating" }

# ------------------------------------------------------------
#  Chat
# ------------------------------------------------------------
chat:
  # Formato del chat normal (MiniMessage). %player%, %message%, %prefix% (LuckPerms/PAPI)
  format:
    enabled: false
    format: "%prefix%<white>%player%<gray>: <reset>%message%"
  # Cooldown entre mensajes de un mismo jugador
  cooldown-seconds: 3
  # Modo lento global con el que arranca el servidor (se cambia en vivo con /slowmode)
  slowmode-seconds: 0
  # Mayúsculas: mensajes de más de min-length con más de max-percent en mayúsculas
  anti-caps:
    enabled: true
    min-length: 12
    max-percent: 70
  # Mensajes repetidos o demasiado seguidos
  anti-spam:
    enabled: true
    window-seconds: 10
    max-similar: 3
  # Publicidad: dominios, IPs, invitaciones a otros servidores
  anti-advertising:
    enabled: true
    notify-staff: true
    # Aplica automáticamente la escalera 'publicidad' tras N detecciones
    punish-after: 2
  # Filtros regex de palabras: se avisa al staff y se bloquea el mensaje
  filters:
    - "(?i)\\b(puta|puto|mierda|pelotudo|boludo)\\b"
  # Comandos bloqueados para jugadores sin permiso (evita fugas de información)
  blocked-commands:
    - "/plugins"
    - "/pl"
    - "/version"
    - "/ver"
    - "/bukkit:plugins"
    - "/about"
  # Registro de chat para /chatlog y /case
  log:
    enabled: true

# ------------------------------------------------------------
#  Reportes
# ------------------------------------------------------------
reports:
  cooldown-seconds: 120
  max-open-per-player: 3
  notify-staff: true
  # ── Webhook de los reportes (/report) ──────────────────────────
  # PARA QUÉ: canal PRIVADO del staff donde caen los reportes. Cada /report llega
  #   como un embed con la cabeza del reportado, quién reporta, el motivo, la
  #   fecha y el número de reporte.
  # DE DÓNDE SE SACA: Discord → ajustes del canal → Integraciones → Webhooks →
  #   Nuevo webhook → Copiar URL del webhook.
  # SI SE DEJA VACÍO: se usa announcements.staff-webhook y, si tampoco hay, el
  #   webhook general de la sección "discord".
  # Cada canal de Discord necesita SU PROPIO webhook: Discord no permite publicar
  # en un canal con el enlace de otro.
  discord-webhook: ""
  # Si es true, el reportero queda oculto en la cola
  anonymous: false
  # Solo se puede reportar a jugadores online
  require-online-target: true

# ------------------------------------------------------------
#  Anti-abuso / cuentas alternativas
# ------------------------------------------------------------
alts:
  enabled: true
  # Exención para IPs compartidas (CGNAT, residencias, bibliotecas)
  cgnat-exempt: false
  # Bloquear la entrada de una segunda cuenta desde la misma IP
  block-multi-account: false
  # Avisar al staff cuando entra una cuenta nueva que comparte IP
  notify-staff-on-new-alt: true

# ------------------------------------------------------------
#  Salud del servidor (watchdog)
# ------------------------------------------------------------
watchdog:
  enabled: true
  interval-seconds: 15
  thresholds:
    tps-warn: 18.0
    tps-critical: 15.0
    mspt-warn: 45.0
    mspt-critical: 60.0
    memory-warn-percent: 85.0
    memory-critical-percent: 92.0
    disk-warn-percent: 90.0
  # No repetir la misma alerta antes de estos minutos
  alert-cooldown-minutes: 10
  # Enviar también las alertas a Discord.
  # PARA QUÉ: avisar en el canal de discord.webhook-url cuando el TPS, el MSPT,
  #   la RAM o el disco pasan de los umbrales de arriba.
  discord: true

# ------------------------------------------------------------
#  Reinicio programado
# ------------------------------------------------------------
restart:
  enabled: false
  # Horas del día (formato HH:mm, hora local del servidor)
  times:
    - "05:00"
  # Avisos antes del reinicio, en segundos
  warnings-seconds: [600, 300, 60, 30, 10]
  # Comando del sistema a ejecutar como reinicio.
  # Vacío = Bukkit.shutdown() (usá run/start.sh con bucle para reiniciar de verdad).
  command: ""

# ------------------------------------------------------------
#  Copias de seguridad
# ------------------------------------------------------------
backups:
  enabled: false
  interval-hours: 6
  # Cuántas copias se conservan (las más viejas se borran)
  keep: 5
  worlds: true
  plugins-config: true
  folder: backups

# ============================================================
#  Canales de Discord — qué webhook va en cada sitio
#  Cada canal de Discord necesita SU PROPIO webhook (Discord no deja publicar
#  en un canal con el enlace de otro). Todos se sacan igual:
#    Discord → ajustes del canal → Integraciones → Webhooks → Nuevo webhook
#    → Copiar URL del webhook   (empieza por https://discord.com/api/webhooks/...)
#
#    discord.webhook-url          alertas del plugin: sanciones, reportes y
#                                 rendimiento. Es el "general": si una sección
#                                 no tiene webhook propio, se usa éste.
#    reports.discord-webhook      cola de /report (canal privado del staff)
#    announcements.public-webhook anuncios de sanciones (canal público)
#    announcements.staff-webhook  copia de esos anuncios (canal del staff)
#    staff.action-log.webhook     registro de comandos del staff (privado)
# ============================================================

# ------------------------------------------------------------
#  Discord — alertas del plugin
#  PARA QUÉ: canal donde el plugin avisa de las sanciones que se aplican, de
#    los reportes recibidos y de los problemas de rendimiento (watchdog).
#  SI SE DEJA VACÍO: no se envía ninguna alerta. El resto del plugin funciona
#    igual y no se pierde nada en la base de datos.
#  El URL es un secreto: no lo compartas ni lo subas al repositorio.
# ------------------------------------------------------------
discord:
  # Interruptor de las alertas de "events" y del watchdog. No afecta al
  # registro de staff, que tiene el suyo en staff.action-log.
  enabled: false
  # Webhook del canal de alertas (ver arriba cómo se consigue).
  webhook-url: ""
  username: "AdminTools"
  avatar-url: ""
  # Qué eventos se anuncian en ese canal.
  events:
    ban: true
    mute: true
    kick: true
    warn: true
    report: true
    watchdog: true

# ------------------------------------------------------------
#  Anuncios de sanciones (canal público de la comunidad)
#  Es independiente del registro de staff: aquel audita lo que hace cada rango,
#  éste publica la moderación. Cada canal tiene su propio webhook y se pueden usar
#  los dos a la vez. Los URLs son secretos: no los subas al repositorio.
# ------------------------------------------------------------
announcements:
  enabled: false
  # ── Webhook del canal PÚBLICO ─────────────────────────────────
  # PARA QUÉ: la comunidad ve cada sanción (ban, cárcel, mute, congelamiento)
  #   con la cabeza del sancionado, el motivo, la duración y la cuenta atrás.
  # SI SE DEJA VACÍO: no se publica nada en el canal público.
  public-webhook: ""
  # ── Webhook del canal PRIVADO DEL STAFF ───────────────────────
  # PARA QUÉ: misma sanción, pero firmada por quien la emitió (su nombre y su
  #   cabeza) y también con el aviso de fin. Es la copia de control del equipo.
  #   Si staff.action-log.webhook está vacío, el registro de comandos del staff
  #   también se manda a este canal.
  # SI SE DEJA VACÍO: no se manda copia al staff.
  staff-webhook: ""
  # Nombre con el que el bot publica (vacío = el mismo de discord.username).
  username: "AdminTools"
  # Cabeza de la skin. {uuid} y {name} se sustituyen por los datos del jugador;
  # con el UUID el avatar no cambia si el jugador se cambia de nombre.
  head-url: "https://mc-heads.net/avatar/{uuid}/128"
  # Avisar también del fin de las sanciones temporales, con otro embed.
  announce-end: true
  # Qué sanciones se anuncian.
  types:
    ban: true
    jail: true
    mute: true
    freeze: true

# ------------------------------------------------------------
#  Herramientas de staff
# ------------------------------------------------------------
staff:
  # Con vanish activo, ¿puede recoger ítems del suelo?
  # En false (recomendado) no se llena el inventario sin querer ni se pierde el ítem.
  vanish-pickup: false
  # Con vanish activo, abrir contenedores sin animación ni sonido para los demás:
  # cofres, barriles, shulkers, hornos, tolvas, alambiques, enderchest, mesas de
  # trabajo, yunques, encantamientos, cortapiedras, telares, y barcas/vagonetas
  # con inventario. La interfaz la sigue viendo solo el staff.
  vanish-silent-containers: true
  # Con vanish activo, silenciar también las acciones que suenan a los que están
  # cerca (se delataría la posición): puertas, trampillas y vallas con puerta se
  # abren sin sonido, botones y palancas no se accionan, y no se puede comer ni
  # beber (el sonido de comer lo genera el cliente y no hay forma de silenciarlo).
  vanish-silent-actions: true
  # Sólo el staff en vanish ve a los demás en vanish. En false, basta con el
  # permiso admintools.staff.vanish.see para verlos aunque no estés invisible.
  vanish-see-requires-vanish: true
  # Brillo del staff en vanish, con un color por rango. El efecto GLOWING se lo
  # aplica el servidor y el color lo pone el equipo del marcador, así que se ve
  # en Java y en Bedrock (Geyser). Colores: green, yellow, red, aqua, blue...
  vanish-glow:
    enabled: true
    helper: green
    moderator: yellow
    admin: red
  # Límite de acciones sensibles (sanciones, limpiezas, restores...) por minuto
  # y por miembro del staff. Frena un ban masivo desde una cuenta comprometida.
  # Quien tenga admintools.staff.limit.bypass se lo salta.
  action-limit:
    enabled: true
    max-per-minute: 40
  # Modo staff (/staffmode): vuelo, invulnerabilidad y hotbar de herramientas.
  mode:
    # Reemplaza la barra rápida por las herramientas (el inventario se guarda
    # en una copia persistente y se devuelve al salir).
    give-tools: true
    # Impide recoger ítems del suelo mientras el modo staff está activo.
    block-pickup: true
  # Espectador de vigilancia: el visor de la hotbar del modo staff pone al
  # jugador en espectador de verdad (atraviesa bloques, no puede tocar nada y
  # los demás no lo ven). Como pierde la barra rápida mientras dura, el tiempo
  # es corto y se puede salir antes con /spectate.
  spectate:
    enabled: true
    # Segundos que puede estar activo antes de salir solo (mínimo 30).
    seconds: 300
    # Segundos de espera antes de poder volver a usarlo (0 = sin recarga).
    cooldown-seconds: 900
  # ── Registro de uso del staff (helpers, moderadores y admins) ──
  # PARA QUÉ: llevar control de lo que hace cada rango. Anota CADA comando y
  #   cada herramienta (vanish, espectador, invsee, freeze…) con quién, qué y
  #   sobre quién, en un canal privado que solo ve el equipo. Las contraseñas,
  #   correos y el doble factor nunca se escriben.
  # SE ENVÍA AGRUPADO: una línea por acción, hasta 12 por mensaje cada 3 s.
  action-log:
    # Activa el registro. Si está en true y no hay webhook, el arranque avisa en
    # consola diciendo exactamente qué falta.
    discord: false
    # Anotar TAMBIÉN los comandos que no son del plugin: /give, /gamemode, /tp,
    # /msg y los de otros plugins (EssentialsX, WorldEdit...). Sólo se registran
    # si quien los ejecuta tiene rango helper, moderador o admin; la consola no
    # entra. Los comandos del propio AdminTools ya se anotan por su cuenta, así
    # que no se duplican. Todo esto queda también en /audit.
    all-commands: true
    # ── Webhook del canal privado del staff ─────────────────────
    # PARA QUÉ: recibir ese registro de comandos y herramientas.
    # SI SE DEJA VACÍO: se usa announcements.staff-webhook (el canal privado del
    #   staff de los anuncios) y, si tampoco hay, el webhook general de "discord".
    webhook: ""

# ------------------------------------------------------------
#  Cárcel
# ------------------------------------------------------------
jail:
  enabled: true
  # /jail sin celda manda al preso a una celda al azar entre las que tienen mundo
  # válido, para que no acabe siempre en la misma. En false se usa "default".
  random-cell: true
  # Celda de reserva para cuando no se puede elegir al azar (sin celdas válidas) y
  # también la celda fija si random-cell es false.
  default: "spawn"
  # Duración por defecto de una condena: "permanent" o 30m, 2h, 7d...
  default-duration: "permanent"
  # Si el preso se sale de la celda, vuelve dentro y el staff recibe un aviso.
  return-on-escape: true
  # Avisar al staff de cada ingreso, salida y fuga.
  notify-staff: true
  # Al cumplir la condena vuelve a donde estaba. En false, al spawn del mundo principal.
  release-to-original: true
  # Sin daño dentro de la cárcel (ni recibido ni infligido).
  block-damage: true
  # Al encarcelar se le guarda el inventario completo (armadura y mano secundaria
  # incluidas) y se le devuelve exacto al salir, sin duplicados.
  confiscate-inventory: true
  # Radio por defecto de /setjail (en bloques, desde el punto de la celda).
  # 2 = área cuadrada de 5x5: quien se sale vuelve dentro al instante.
  default-radius: 2
  # Poner al preso en modo aventura mientras dure la condena. El cliente deja de
  # romper/colocar bloques (sin bloques fantasma en Bedrock) y se le devuelve su
  # modo de juego original al salir.
  adventure-mode: true
  # Comandos que un preso puede seguir usando. Los de login van incluidos a propósito:
  # bloquearlos dejaría al jugador sin poder autenticarse y quedaría atrapado.
  allowed-commands:
    - login
    - register
    - l
    - reg
    - auth
    - changepassword

# NOTA: el tiempo de condena baja sólo mientras el preso está conectado
# (comportamiento clásico de xJail), y se guarda al salir y cada 30 segundos.

# ------------------------------------------------------------
#  Rollback de inventarios (/rollback)
# ------------------------------------------------------------
rollback:
  enabled: true
  # Cuándo se guarda una copia completa (inventario, enderchest, posición y stats).
  events:
    join: true
    quit: true
    death: true
    world-change: true
  # Copia automática cada N minutos a todos los conectados (0 = desactivado).
  interval-minutes: 0
  # Copias que se conservan por jugador y motivo; las viejas se borran solas.
  keep:
    death: 30
    join: 10
    quit: 10
    manual: 20
  # Copias por página en /rollback <jugador>
  page-size: 8

# ------------------------------------------------------------
#  Paneles por rango (/helper, /moderator, /admin)
# ------------------------------------------------------------
panel:
  # Interfaz de los paneles.
  #   auto      = diálogos nativos en Java y formularios Bedrock si hay Floodgate
  #   inventory = menú de inventario Bukkit (el clásico; funciona en todas partes)
  #   dialog    = diálogos de Minecraft 1.21.6+ también para Bedrock (vía Geyser)
  ui: auto
  # Cuando el jugador entra desde Bedrock y Floodgate está instalado, usar sus
  # formularios nativos en lugar del diálogo Java.
  bedrock-forms: true
  # Segundos que el panel espera a que el staff escriba un dato por chat
  # (sólo en la interfaz de inventario).
  chat-input-seconds: 60

# ------------------------------------------------------------
#  Integraciones (se activan solas si el plugin está instalado)
# ------------------------------------------------------------
integrations:
  luckperms: true
  coreprotect: true
  placeholderapi: true
  # Reenviar al staff las alertas de anticheats detectados (Vulcan, Grim, ...)
  anticheat-alerts: true
